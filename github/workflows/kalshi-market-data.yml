name: Update Kalshi Market Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-market-data
  cancel-in-progress: false

jobs:
  update-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Kalshi markets
        run: python scripts/fetch_kalshi_markets.py

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kalshi_markets.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Kalshi market data"
            git push
          fi
